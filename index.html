<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Map Version</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .container {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 480px;
      width: 90%;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }

    p {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      display: block;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease-in-out;
    }

    .btn-primary {
      background-color: #3498db;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: #2ecc71;
      color: #ffffff;
    }

    .btn-secondary:hover {
      background-color: #27ae60;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Select Map View</h1>
    <p>Please choose which version of the OGF map you would like to run:</p>

    <div class="button-group">
      <a href="./index0.html" class="btn btn-primary">
        iTowns + Flight Path Version
      </a>
      <a href="./index_maplibre.html" class="btn btn-secondary">
        MapLibre Version
      </a>
    </div>
  </div>

</body>
</html>
