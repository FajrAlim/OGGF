<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGF - GeoLibre Version</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    #geolibreFrame {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
    }

    #backBtn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      padding: 0.5rem 1rem;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 600;
      text-decoration: none;
      color: #333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    #backBtn:hover {
      background: #f4f7f6;
    }
  </style>
</head>
<body>

  <a href="./index.html" id="backBtn">&larr; Back to Menu</a>

  <iframe
    id="geolibreFrame"
    src="https://viewer.geolibre.app/?url=https://raw.githubusercontent.com/FajrAlim/OGGF/refs/heads/main/data/layers/ogf-project.geolibre.json&maponly"
    allowfullscreen>
  </iframe>

</body>
</html>
